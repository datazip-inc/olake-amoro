ams:
  admin-username: admin
  admin-password: password
  server-bind-host: "0.0.0.0"
  server-expose-host: "127.0.0.1"

  thrift-server:
    max-message-size: 100MB # 104857600
    selector-thread-count: 2
    selector-queue-size: 4
    table-service:
      bind-port: 1260
      worker-thread-count: 20
    optimizing-service:
      bind-port: 2261

  http-server:
    session-timeout: 7d
    bind-port: 1630
    rest-auth-type: token

  refresh-external-catalogs:
    interval: 3min # 180000
    thread-count: 10
    queue-size: 1000000

  refresh-tables:
    thread-count: 10
    interval: 1min # 60000
    max-pending-partition-count: 100 # default 100

  self-optimizing:
    commit-thread-count: 10
    runtime-data-keep-days: 30
    runtime-data-expire-interval-hours: 1
    refresh-group-interval: 30s

  optimizer:
    heart-beat-timeout: 1min # 60000
    task-ack-timeout: 30s # 30000
    task-execute-timeout: 1h # 3600000
    polling-timeout: 3s # 3000
    max-planning-parallelism: 1 # default 1

  blocker:
    timeout: 1min # 60000

  # optional features
  expire-snapshots:
    enabled: true
    thread-count: 10

  clean-orphan-files:
    enabled: true
    thread-count: 10
    interval: 1d

  clean-dangling-delete-files:
    enabled: true
    thread-count: 10

  sync-hive-tables:
    enabled: false
    thread-count: 10

  data-expiration:
    enabled: true
    thread-count: 10
    interval: 1d

  auto-create-tags:
    enabled: true
    thread-count: 3
    interval: 1min # 60000

  table-manifest-io:
    thread-count: 20

  catalog-meta-cache:
    expiration-interval: 60s

  # Support for encrypted sensitive configuration items
  shade:
    identifier: default # Built-in support for default/base64. Defaults to "default", indicating no encryption
    sensitive-keywords: admin-password;database.password

  overview-cache:
    refresh-interval: 3min          # 3 min
    max-size: 3360                # Keep 7 days history by default, 7 * 24 * 60 / 3 = 3360

  # Postgres — use localhost when running AMS from code (IDE / mvn).
  # Ensure Postgres is running (e.g. local install or: docker run -p 5432:5432 -e POSTGRES_USER=iceberg -e POSTGRES_PASSWORD=password -e POSTGRES_DB=iceberg postgres:15)
  database:
    type: postgres
    jdbc-driver-class: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/iceberg
    username: iceberg
    password: password
    connection-pool-max-total: 20
    connection-pool-max-idle: 16
    connection-pool-max-wait-millis: 30000
    auto-create-tables: true

  terminal:
    backend: local
    result:
      limit: 1000
    stop-on-error: false
    session:
      timeout: 30min # 1800000
    local:
      using-session-catalog-for-hive: false
      spark.sql.iceberg.handle-timestamp-without-timezone: false
      spark.sql.codegen.wholeStage: "false"

# ---------------------------------------------------------------------------
# Optimizer Containers
# ---------------------------------------------------------------------------
# localContainer  — runs inside the Amoro JVM; zero external dependencies.
#
# sparkContainer  — submits Spark jobs to the Kind K8s cluster.
#                   The docker-compose "amoro-init" service auto-creates the
#                   'spark-container' optimizer group + 1 optimizer using this.
#                   Requires the olakego/fusion-spark:latest image to
#                   be built and loaded into Kind (done automatically by the
#                   kind-load-image service).
# ---------------------------------------------------------------------------
containers:
  - name: localContainer
    container-impl: org.apache.amoro.server.manager.LocalOptimizerContainer
    properties:
      export.JAVA_HOME: "/opt/java/openjdk"   # eclipse-temurin JDK path

  # Development-friendly local optimizer container.
  # This uses the AMS process environment (JAVA_HOME/PATH) and avoids machine-specific paths.
  # When creating an optimizer group for this container, set group property `memory` (MB/thread).
  - name: localDevContainer
    container-impl: org.apache.amoro.server.manager.LocalOptimizerContainer
    properties: {}

  - name: sparkContainer
    container-impl: org.apache.amoro.server.manager.SparkOptimizerContainer
    properties:
      spark-home: /Users/apple/Desktop/colake/olake-amoro/docker/kind/data/.runtime/spark/
      # Use the active Kind API server endpoint from ~/.kube/config.
      master: k8s://https://127.0.0.1:33971
      deploy-mode: cluster
      # Driver pod must load jar from its own filesystem path.
      job-uri: "local:///opt/spark/usrlib/optimizer-job.jar"
      # Driver pod must reach AMS thrift service on host machine.
      ams-optimizing-uri: thrift://host.docker.internal:2261
      export.HADOOP_USER_NAME: spark
      export.SPARK_CONF_DIR: /Users/apple/Desktop/colake/olake-amoro/docker/kind/data/.runtime/spark/conf/
      spark-conf.spark.kubernetes.container.image: "olakego/fusion-spark:latest"
      spark-conf.spark.kubernetes.container.image.pullPolicy: "IfNotPresent"
      spark-conf.spark.kubernetes.namespace: spark
      spark-conf.spark.kubernetes.authenticate.driver.serviceAccountName: spark
      spark-conf.spark.kubernetes.authenticate.executor.serviceAccountName: spark
      spark-conf.spark.dynamicAllocation.enabled: "true"
      spark-conf.spark.shuffle.service.enabled: "false"
      spark-conf.spark.dynamicAllocation.shuffleTracking.enabled: "true"
      spark-conf.spark.driver.memory: "1g"
      spark-conf.spark.executor.memory: "1g"
      spark-conf.spark.executor.cores: "1"
      # AWS/MinIO credentials for S3FileIO (Spark optimizer pods need these)
      spark-conf.spark.kubernetes.driver.secretKeyRef.AWS_ACCESS_KEY_ID: "fusion-s3-credentials:access-key-id"
      spark-conf.spark.kubernetes.driver.secretKeyRef.AWS_SECRET_ACCESS_KEY: "fusion-s3-credentials:secret-access-key"
      spark-conf.spark.kubernetes.executor.secretKeyRef.AWS_ACCESS_KEY_ID: "fusion-s3-credentials:access-key-id"
      spark-conf.spark.kubernetes.executor.secretKeyRef.AWS_SECRET_ACCESS_KEY: "fusion-s3-credentials:secret-access-key"
